[project]
name = "relaydeck-terminal"
version = "0.1.0"
description = "RelayDeck terminal emulator extension for Flet (xterm2 bridge)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "flet==1.0.3",
]

[tool.setuptools.package-data]
"flutter.relaydeck_terminal" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
