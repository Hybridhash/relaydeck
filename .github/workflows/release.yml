# RelayDeck release evidence.
#
# MANUAL DISPATCH ONLY. This workflow builds UNSIGNED test packaging and
# collects provenance (build manifest, SBOM, license inventory, secret
# scan, hashes). It never signs with a production key and never uploads
# to any store.
#
# Production signing and store upload are EXPLICIT MANUAL OWNER OPERATIONS:
#   1. Owner downloads the `release-evidence-<sha>` artifact (unsigned AAB).
#   2. On the owner's trusted machine, sign with the production keystore
#      over a secure channel (keys are never in chat, repo files, or CI):
#        uv run flet build aab --python-version 3.13 \
#          --android-signing-key-store <owner-keystore.jks> \
#          --android-signing-key-store-password <via secure prompt> \
#          --android-signing-key-alias <alias> \
#          --android-signing-key-password <via secure prompt>
#      (flags verified in flet-cli 1.0.3 `flet build aab --help`.)
#   3. Owner verifies hashes, uploads the SIGNED bundle via the Play
#      Console (manual web UI step), and records hashes + approvals in
#      the maintainers' release evidence record.
# `flet build aab` builds a package; it never publishes to a store.

name: Release evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: workflow ref)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.13"
  FLUTTER_VERSION: "3.44.8"
  UV_VERSION: "0.12.15"

jobs:
  evidence:
    name: unsigned package + provenance bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No secrets.* context is referenced anywhere in this workflow by design.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Locked dependency resolution
        run: uv sync --locked --extra companion --group dev

      - name: Secret scan (must be clean)
        run: uv run python scripts/scan_release_secrets.py

      - name: License inventory SBOM (fails on unknown)
        run: uv run python scripts/license_inventory.py --out sbom.json

      - name: Build unsigned AAB (test packaging only)
        # No --android-signing-* flags by design (see header).
        run: uv run flet build aab --python-version 3.13 --yes

      - name: Emit build manifest with AAB hash
        run: |
          AAB=$(ls build/aab/*.aab | head -n 1)
          SHA=$(git rev-parse HEAD)
          uv run python scripts/build_manifest.py --aab "$AAB" --out build-manifest.json
          sha256sum "$AAB" sbom.json build-manifest.json > SHA256SUMS
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          cat build-manifest.json
        id: manifest

      - name: Upload release evidence bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            build/aab/*.aab
            sbom.json
            build-manifest.json
            SHA256SUMS
          retention-days: 90

      - name: Owner next steps (manual, not automated)
        run: |
          {
            echo "## Release evidence ready (unsigned)"
            echo ""
            echo "The bundle above is UNSIGNED test packaging plus provenance."
            echo "Production signing + Play upload are manual owner steps:"
            echo "1. Download release-evidence-${{ github.sha }}."
            echo "2. Sign on a trusted machine with the production keystore"
            echo "   (secure channel; see workflow header for the exact command)."
            echo "3. Verify SHA256SUMS, upload via the Play Console web UI,"
            echo "   record hashes + approvals in the release evidence record."
          } >> "$GITHUB_STEP_SUMMARY"
