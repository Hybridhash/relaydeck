# Mac primary profile template. No credentials are included or generated.
# Copy to ~/.config/relaydeck/companion.toml, owner-only (0600).
# Set the exact HTTPS address shown by your explicitly configured Tailscale Serve.
advertised_origin = "https://your-mac.your-tailnet.ts.net"
bind_host = "127.0.0.1"
port = 8125
host_id = "home-mac"
state_dir = "~/Library/Application Support/RelayDeck"
cookie_secret_file = "~/.config/relaydeck/cookie.secret"
cursor_secret_file = "~/.config/relaydeck/cursor.secret"
connector_credentials = "~/.config/relaydeck/connector.json"
herdr_socket = "~/.config/herdr/herdr.sock"
# Browser UI on this Mac. false = bridge only: the companion serves just the
# API the Android app pairs with and uses, plus the Herdr connector.
web_ui = true
# Optional after Firebase setup; regular owner-only JSON, no inline key.
# fcm_credentials = "~/.config/relaydeck/fcm-service-account.json"
# identity_config = "~/.config/relaydeck/identity.json"
# Herdr agent kinds this Mac may start (see `herdr agent start --help` for the
# supported names); each must also be on PATH.
agent_kinds = []

# Optional, local numeric usage collection. Only explicitly listed kind/root pairs are read.
# [usage]
# retention_days = 90
# timezone = "Etc/UTC" # omit to use the system IANA timezone
# price_tables = ["/absolute/private/prices.toml"] # omit for tokens-only reports
# [[usage.sources]]
# kind = "kind-a" # must also be in agent_kinds
# format = "jsonl-message-usage-v1"
# root = "/absolute/owner/log-directory"
# display_name = "Kind A"
# limits_format = "json-statusline-limits-v1" # optional, independent of transcript format
# limits_cache = "/absolute/private/statusline-limits.json" # unique per limits source
# limits_settings = "/absolute/owner/settings.json" # optional read-only managed-hook check
# On-demand plan limits through a temporary tool tab (manual refresh button).
# kind must be one of the sources above. A press opens a fresh <kind>-relaydeck
# tab, reads the tool's /usage screen numbers, then quits and closes the tab.
# [[usage.limits]]
# kind = "kind-a"
# format = "tui-usage-pane-v1"
# on_demand = true
# timeout_seconds = 90 # total bound for one refresh, 30..300

# Notifications. Web push is the default route for browsers and home-screen apps. Each companion has
# its own VAPID keys; RelayDeck runs no push server. The browser's push service receives delivery
# metadata and an encrypted message. The lock screen shows generic text unless lock_screen_detail is true.
# [notifications]
# web_push = true # false turns web push off; the packaged Android route is separate
# lock_screen_detail = false # true adds the host name to the lock-screen text
# vapid_subject = "https://example.com/relaydeck" # routable, non-personal; push services
# reject placeholder domains such as .invalid or localhost
