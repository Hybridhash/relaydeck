# CLI catalog for `relaydeck setup --detect`. Versioned data only: no code, no personal paths.
# This is the ONE file under src/relaydeck allowed to name CLI products (tests/unit/test_no_agent_product_names.py).
# herdr_detects: the CLI has a Herdr detection manifest (the 22 manifest ids; agy is the antigravity entry).
# reader_root: the directory a tier-A reader enumerates (what setup writes); default_roots are the CLI's log locations, for detection only.
# Roots use `~`; the env override names are the CLI's own, never an aggregator's. A tier-A reader_format is one
# this build reads today. Tiers: A works today (a reader parses the format); B needs a JSON/JSONL reader; C needs a SQLite reader; D reports no reliable tokens; E is not supported yet.
catalog_version = 1

[[cli]]
id = "claude"
herdr_detects = true
display_name = "Claude Code"
aliases = ["claude-code"]
binaries = ["claude"]
default_roots = ["~/.claude/projects"]
reader_root = "~/.claude/projects"
env_override = "CLAUDE_CONFIG_DIR"
env_subdir = "projects"
reader_format = "jsonl-message-usage-v1"
limits = "statusline-hook"
tier = "A"
evidence = "JSONL message logs read on this Mac; limits via the statusline hook."
herdr_integration = "claude"

[[cli]]
id = "codex"
herdr_detects = true
display_name = "Codex"
aliases = []
binaries = ["codex"]
default_roots = ["~/.codex/sessions"]
reader_root = "~/.codex"
env_override = "CODEX_HOME"
env_subdir = "sessions"
reader_format = "jsonl-cumulative-token-count-v1"
limits = "jsonrpc-rate-limits-stdio-v1"
tier = "A"
evidence = "Cumulative token-count logs read on this Mac; limits via the stdio rate-limits feed."
herdr_integration = "codex"

[[cli]]
id = "muse"
herdr_detects = true
display_name = "Muse"
aliases = []
binaries = ["muse"]
default_roots = ["~/.local/share/muse/sessions"]
reader_root = "~/.local/share/muse"
env_override = "MUSE_SESSIONS_DIR"
env_subdir = ""
reader_format = "jsonl-event-usage-v1"
limits = "tui-usage-pane-v1"
tier = "A"
evidence = "JSONL event logs read on this Mac; limits via the usage pane; model enrichment pending."

[cli.tui]
launch_new = [
  "muse", "--preset", "empty", "--model", "muse-spark-1.3", "--reasoning-effort", "minimal",
]
launch_resume = ["muse", "resume", "{id}"]
hint_pattern = 'To continue this session, run muse resume (?P<id>[0-9a-f-]{36})'
id_pattern = "[0-9a-f-]{36}"
session_root = "~/.local/share/muse/sessions"
session_entry = ".msp-view-g6/{id}"
not_found = []
warmup_prompt = "reply with the single word ok"
warmup_marker = "(?m)^◆"
usage_enters = 2
untrusted = ["Do you trust this workspace"]
trust_store = "~/.config/muse/trust.json"
probe_dir = "{state_dir}/muse-probe"
quit_text = "/quit"
prompt_marker = "(?m)^❯"
usage_marker = "Subscription"
idle = ['Subscription[^\n]*\n[^\n]*Currently unavailable']
binary = "muse"
plan_pattern = 'Subscription · (?P<plan>[^\n]+)'

[[cli.tui.windows]]
key = "current"
pattern = 'Current\s+(?P<percent>[0-9]+)% used'
reset_pattern = 'Resets at (?P<reset>[0-9]{1,2}:[0-9]{2} [AP]M)'
reset_kind = "clock"
minutes = 300

[[cli.tui.windows]]
key = "weekly"
pattern = 'Weekly\s+(?P<percent>[0-9]+)% used'
reset_pattern = 'Resets (?P<reset>[A-Z][a-z]{2} [0-9]{1,2} at [0-9]{1,2}:[0-9]{2} [AP]M)'
reset_kind = "monthday"
minutes = 10080

[[cli]]
id = "kiro"
herdr_detects = true
display_name = "Kiro"
aliases = ["kiro-cli"]
binaries = ["kiro-cli", "kiro"]
default_roots = ["~/.kiro/sessions/cli"]
reader_root = "~/.kiro"
reader_format = "json-session-turns-v1"
limits = "tui-usage-pane-v1"
tier = "A"
evidence = "Session-turn logs read on this Mac; limits via the usage pane; credits meter pending."

[cli.tui]
launch_new = ["kiro-cli", "chat", "--agent-engine", "v2"]
refuse = ["(?i)don't have a `?/usage`? command", "(?i)no `?/usage`? (command|tool)"]
launch_resume = ["kiro-cli", "--resume-id", "{id}"]
quit_text = "/quit"
quit_marker = 'Session ended\.'
dismiss = "esc"
prompt_marker = "ask a question or describe a task"
usage_marker = 'Credits \('
hint_pattern = 'Resume with: kiro-cli --resume-id (?P<id>\S+)'
id_pattern = "[A-Za-z0-9][A-Za-z0-9_.-]{0,127}"
session_root = "~/.kiro/sessions/cli"
not_found = []
binary = "kiro-cli"
plan_pattern = '\|[ ]*(?P<plan>[A-Z][A-Za-z0-9 ._-]{1,31})[ ]*$'

[[cli.tui.windows]]
key = "month"
pattern = 'Credits \((?P<used>[0-9]+(?:\.[0-9]+)?) of (?P<limit>[0-9]+(?:\.[0-9]+)?)[^)]*\)'
unit = "credit"
reset_pattern = 'resets on (?P<reset>[0-9]{4}-[0-9]{2}-[0-9]{2})'
reset_kind = "date"

