[themes]
# Seasonal overlays. An overlay may replace only decorative colours (grounds, surfaces,
# borders, accent and primary fills); status, text and terminal colours are refused.
# active: "auto" applies the overlay whose window holds today, "default" applies none,
# or name an overlay to force it. RELAYDECK_THEME overrides this for one process.
active = "auto"

[themes.christmas]
# Evergreen grounds with crimson brand fills, from mid-December to the new year.
window = ["12-15", "01-02"]

