# RelayDeck theme — single source of the app's look.
# Resolved by client/theme.py at import; edit values here, never in code.
# Provenance: palette + console constants transcribed from the mock
# design; deviations recorded in tokens history stay documented
# in client/components/design_system/tokens.py (now an adapter).

